<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" width="1040" height="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pakka architecture: engines decide money, AI only writes words">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7A90"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00A3D9"/></marker>
  </defs>
  <rect width="1040" height="690" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#002E6E">Pakka architecture: engines decide money, AI only writes words</text>

  <!-- Clients -->
  <rect x="20" y="56" width="1000" height="104" rx="12" fill="#F5F8FC" stroke="#D5DCE6"/>
  <text x="34" y="76" font-size="12" font-weight="600" fill="#6B7A90">WHO USES IT</text>
  <g font-size="13" text-anchor="middle">
    <rect x="34" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="110" y="111" font-weight="600" fill="#1A1F36">Customer app</text><text x="110" y="130" font-size="12" fill="#5A6577">/app, /live</text>
    <rect x="198" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="274" y="111" font-weight="600" fill="#1A1F36">Merchant console</text><text x="274" y="130" font-size="12" fill="#5A6577">/merchant</text>
    <rect x="362" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="438" y="111" font-weight="600" fill="#1A1F36">Control room</text><text x="438" y="130" font-size="12" fill="#5A6577">/ops, review trail</text>
    <rect x="526" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="602" y="111" font-weight="600" fill="#1A1F36">Story view</text><text x="602" y="130" font-size="12" fill="#5A6577">/demo</text>
    <rect x="690" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="766" y="111" font-weight="600" fill="#1A1F36">Business console</text><text x="766" y="130" font-size="12" fill="#5A6577">/business</text>
    <rect x="854" y="86" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="930" y="111" font-weight="600" fill="#1A1F36">External AI agents</text><text x="930" y="130" font-size="12" fill="#5A6577">TS or Python SDK</text>
  </g>
  <path d="M520 160V196" stroke="#6B7A90" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Server -->
  <rect x="20" y="200" width="1000" height="88" rx="12" fill="#F5F8FC" stroke="#D5DCE6"/>
  <text x="34" y="222" font-size="14" font-weight="700" fill="#002E6E">Next.js 16 on Vercel, Mumbai (bom1)</text>
  <g font-size="12.5" text-anchor="middle" fill="#1A1F36">
    <rect x="34" y="236" width="182" height="38" rx="19" fill="#FFFFFF" stroke="#C3CCD8"/><text x="125" y="260"><tspan font-weight="600">/api/sessions</tspan> shared demo</text>
    <rect x="228" y="236" width="182" height="38" rx="19" fill="#FFFFFF" stroke="#C3CCD8"/><text x="319" y="260"><tspan font-weight="600">/api/live</tspan> passkeys</text>
    <rect x="422" y="236" width="182" height="38" rx="19" fill="#FFFFFF" stroke="#C3CCD8"/><text x="513" y="260"><tspan font-weight="600">/api/llm</tspan> live questions</text>
    <rect x="616" y="236" width="182" height="38" rx="19" fill="#FFFFFF" stroke="#C3CCD8"/><text x="707" y="260"><tspan font-weight="600">/api/voice</tspan> speak, listen</text>
    <rect x="810" y="236" width="196" height="38" rx="19" fill="#FFFFFF" stroke="#C3CCD8"/><text x="908" y="260"><tspan font-weight="600">/api/v1</tspan> business, agents</text>
  </g>
  <g stroke="#6B7A90" stroke-width="1.5" fill="none">
    <path d="M175 288V326" marker-end="url(#a)"/>
    <path d="M590 288V326" marker-end="url(#a)"/>
    <path d="M925 288V326" marker-end="url(#a)"/>
  </g>

  <!-- Engines -->
  <rect x="20" y="330" width="310" height="170" rx="12" fill="#EEF3FA" stroke="#002E6E" stroke-width="1.5"/>
  <text x="34" y="354" font-size="14" font-weight="700" fill="#002E6E">Engines: pure TypeScript</text>
  <text x="34" y="372" font-size="12" fill="#5A6577">decide everything that moves money</text>
  <rect x="34" y="384" width="282" height="50" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
  <text x="48" y="405" font-size="13" font-weight="600" fill="#1A1F36">AutoPay engine</text>
  <text x="48" y="423" font-size="12" fill="#5A6577">rules, risk score, one gateway, 8 invariants</text>
  <rect x="34" y="440" width="282" height="50" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
  <text x="48" y="461" font-size="13" font-weight="600" fill="#1A1F36">Business engine</text>
  <text x="48" y="479" font-size="12" fill="#5A6577">3 agents, treasury guard, hash ledger</text>

  <!-- AI layer -->
  <rect x="380" y="330" width="420" height="170" rx="12" fill="#E8F7FD" stroke="#00A3D9" stroke-width="1.5"/>
  <text x="394" y="354" font-size="14" font-weight="700" fill="#002E6E">AI layer: words only</text>
  <text x="394" y="372" font-size="12" fill="#5A6577">every model call is masked, reviewed and fact-checked</text>
  <g font-size="13" text-anchor="middle">
    <rect x="394" y="390" width="116" height="74" rx="8" fill="#FFFFFF" stroke="#7FD3EF"/>
    <text x="452" y="420" font-weight="600" fill="#1A1F36">Privacy</text><text x="452" y="437" font-weight="600" fill="#1A1F36">masking</text><text x="452" y="454" font-size="11.5" fill="#5A6577">no PII leaves</text>
    <rect x="530" y="390" width="116" height="74" rx="8" fill="#FFFFFF" stroke="#7FD3EF"/>
    <text x="588" y="420" font-weight="600" fill="#1A1F36">3-agent</text><text x="588" y="437" font-weight="600" fill="#1A1F36">review</text><text x="588" y="454" font-size="11.5" fill="#5A6577">11 criteria</text>
    <rect x="666" y="390" width="120" height="74" rx="8" fill="#FFFFFF" stroke="#7FD3EF"/>
    <text x="726" y="420" font-weight="600" fill="#1A1F36">Demo cache</text><text x="726" y="437" font-size="11.5" fill="#5A6577">baked, reviewed</text><text x="726" y="454" font-size="11.5" fill="#5A6577">texts</text>
  </g>
  <g stroke="#00A3D9" stroke-width="1.5" fill="none">
    <path d="M510 427H526" marker-end="url(#ab)"/>
    <path d="M646 427H662" marker-end="url(#ab)"/>
  </g>
  <text x="590" y="488" font-size="11.5" text-anchor="middle" fill="#5A6577">fails any check: the hand-written template is used</text>

  <!-- engines ask AI for words -->
  <path d="M330 415H376" stroke="#00A3D9" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ab)"/>
  <text x="355" y="398" font-size="11" text-anchor="middle" fill="#00A3D9">asks for</text>
  <text x="355" y="410" font-size="11" text-anchor="middle" fill="#00A3D9">words</text>

  <!-- Database -->
  <path d="M830 346a95 16 0 0 1 190 0v138a95 16 0 0 1 -190 0z" fill="#F5F8FC" stroke="#002E6E" stroke-width="1.5"/>
  <path d="M830 346a95 16 0 0 0 190 0" fill="none" stroke="#002E6E" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="925" y="398" font-size="14" font-weight="700" fill="#002E6E">Supabase</text>
    <text x="925" y="416" font-size="13" fill="#1A1F36">Postgres, Mumbai</text>
    <text x="925" y="442" font-size="11.5" fill="#5A6577">demo event log</text>
    <text x="925" y="458" font-size="11.5" fill="#5A6577">business ledgers</text>
    <text x="925" y="474" font-size="11.5" fill="#5A6577">live people</text>
  </g>

  <!-- Simulators -->
  <path d="M175 500V568" stroke="#6B7A90" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="185" y="538" font-size="11.5" fill="#5A6577">simulated money only</text>
  <rect x="20" y="572" width="310" height="62" rx="12" fill="#FFF7E8" stroke="#E8B04B"/>
  <text x="34" y="597" font-size="13" font-weight="600" fill="#1A1F36">Simulators</text>
  <text x="34" y="616" font-size="12" fill="#5A6577">bank, merchant, NPCI, sandbox payouts</text>

  <!-- Providers -->
  <path d="M590 500V552" stroke="#00A3D9" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="600" y="530" font-size="11.5" fill="#5A6577">tokens, never personal data</text>
  <rect x="380" y="556" width="420" height="116" rx="12" fill="#F5F8FC" stroke="#D5DCE6"/>
  <text x="394" y="578" font-size="12" font-weight="600" fill="#6B7A90">MODEL PROVIDERS, ANY ONE WORKS</text>
  <g font-size="13" text-anchor="middle">
    <rect x="394" y="590" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="455" y="616" font-weight="600" fill="#1A1F36">Gemini 3.5</text><text x="455" y="634" font-size="11.5" fill="#5A6577">Flash, Flash-Lite</text>
    <rect x="529" y="590" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="590" y="616" font-weight="600" fill="#1A1F36">Claude</text><text x="590" y="634" font-size="11.5" fill="#5A6577">Sonnet, Haiku</text>
    <rect x="664" y="590" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#C3CCD8"/>
    <text x="725" y="616" font-weight="600" fill="#1A1F36">Sarvam AI</text><text x="725" y="634" font-size="11.5" fill="#5A6577">105B, Bulbul, Saaras</text>
  </g>

  <!-- server to DB note -->
  <text x="830" y="530" font-size="11.5" fill="#5A6577">Browsers replay the same</text>
  <text x="830" y="546" font-size="11.5" fill="#5A6577">event log, so every screen</text>
  <text x="830" y="562" font-size="11.5" fill="#5A6577">shows what the server decided</text>
</svg>
